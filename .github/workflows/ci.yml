name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Verify & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: culer_db
          POSTGRES_USER: culer_user
          POSTGRES_PASSWORD: culer_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: 'False'
      SECRET_KEY: 'ci-pipeline-production-test-secret-key-with-over-50-characters-for-testing'
      ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      DATABASE_URL: 'postgres://culer_user:culer_password@localhost:5432/culer_db'
      REDIS_URL: 'redis://localhost:6379/0'
      CELERY_BROKER_URL: 'redis://localhost:6379/1'
      DISABLE_WHITENOISE_MANIFEST: 'true'
      SECURE_SSL_REDIRECT: 'True'
      SECURE_HSTS_SECONDS: '31536000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify no unmigrated model changes
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Django deployment security checks
        run: |
          python manage.py check --deploy

      - name: Run database migrations
        run: |
          python manage.py migrate --noinput

      - name: Seed demo data and verify intelligence pipeline
        run: |
          python manage.py bootstrap_platform --seed-demo --verify-pipeline

      - name: Run pre-flight diagnostic check
        run: |
          python scripts/prod_check.py

      - name: Run test suite
        run: |
          python manage.py test --verbosity=2
