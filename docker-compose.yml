version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: culer_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-culer_db}
      POSTGRES_USER: ${POSTGRES_USER:-culer_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-culer_password_change_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-culer_user} -d ${POSTGRES_DB:-culer_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: culer_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: culer_web
    command: ["web"]
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-generate-random-secret-key-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      DATABASE_URL: postgres://${POSTGRES_USER:-culer_user}:${POSTGRES_PASSWORD:-culer_password_change_in_production}@db:5432/${POSTGRES_DB:-culer_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: culer_worker
    command: ["worker"]
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-generate-random-secret-key-in-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-culer_user}:${POSTGRES_PASSWORD:-culer_password_change_in_production}@db:5432/${POSTGRES_DB:-culer_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: culer_beat
    command: ["beat"]
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-generate-random-secret-key-in-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-culer_user}:${POSTGRES_PASSWORD:-culer_password_change_in_production}@db:5432/${POSTGRES_DB:-culer_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

