<div id="reaction-badges-{{ post.id }}" class="reaction-badges-container" style="display: inline-flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
    <!-- Upvote Badge -->
    <form hx-post="{% url 'community:toggle_reaction' post.id %}" hx-target="#reaction-badges-{{ post.id }}" hx-swap="outerHTML" style="display: inline; margin: 0;">
        {% csrf_token %}
        <input type="hidden" name="reaction_type" value="UPVOTE">
        <button type="submit" class="reaction-btn {% if 'UPVOTE' in reactions.user_reactions %}active{% endif %}" title="Upvote" style="background: {% if 'UPVOTE' in reactions.user_reactions %}rgba(59, 130, 246, 0.25){% else %}rgba(255, 255, 255, 0.05){% endif %}; border: 1px solid {% if 'UPVOTE' in reactions.user_reactions %}#3b82f6{% else %}rgba(255, 255, 255, 0.15){% endif %}; color: {% if 'UPVOTE' in reactions.user_reactions %}#60a5fa{% else %}var(--text-secondary, #cbd5e1){% endif %}; border-radius: 9999px; padding: 0.25rem 0.65rem; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem; transition: all 0.2s ease;">
            <i class="fa-solid fa-arrow-up"></i>
            <span class="tabular-numbers">{{ reactions.upvotes|default:0 }}</span>
        </button>
    </form>

    <!-- Tactical Insight Badge -->
    <form hx-post="{% url 'community:toggle_reaction' post.id %}" hx-target="#reaction-badges-{{ post.id }}" hx-swap="outerHTML" style="display: inline; margin: 0;">
        {% csrf_token %}
        <input type="hidden" name="reaction_type" value="TACTICAL_INSIGHT">
        <button type="submit" class="reaction-btn {% if 'TACTICAL_INSIGHT' in reactions.user_reactions %}active{% endif %}" title="Tactical Insight" style="background: {% if 'TACTICAL_INSIGHT' in reactions.user_reactions %}rgba(245, 158, 11, 0.25){% else %}rgba(255, 255, 255, 0.05){% endif %}; border: 1px solid {% if 'TACTICAL_INSIGHT' in reactions.user_reactions %}#f59e0b{% else %}rgba(255, 255, 255, 0.15){% endif %}; color: {% if 'TACTICAL_INSIGHT' in reactions.user_reactions %}#fbbf24{% else %}var(--text-secondary, #cbd5e1){% endif %}; border-radius: 9999px; padding: 0.25rem 0.65rem; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem; transition: all 0.2s ease;">
            <i class="fa-solid fa-lightbulb"></i>
            <span class="tabular-numbers">{{ reactions.insights|default:0 }}</span>
        </button>
    </form>

    <!-- Agree Badge -->
    <form hx-post="{% url 'community:toggle_reaction' post.id %}" hx-target="#reaction-badges-{{ post.id }}" hx-swap="outerHTML" style="display: inline; margin: 0;">
        {% csrf_token %}
        <input type="hidden" name="reaction_type" value="AGREE">
        <button type="submit" class="reaction-btn {% if 'AGREE' in reactions.user_reactions %}active{% endif %}" title="Agree" style="background: {% if 'AGREE' in reactions.user_reactions %}rgba(16, 185, 129, 0.25){% else %}rgba(255, 255, 255, 0.05){% endif %}; border: 1px solid {% if 'AGREE' in reactions.user_reactions %}#10b981{% else %}rgba(255, 255, 255, 0.15){% endif %}; color: {% if 'AGREE' in reactions.user_reactions %}#34d399{% else %}var(--text-secondary, #cbd5e1){% endif %}; border-radius: 9999px; padding: 0.25rem 0.65rem; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem; transition: all 0.2s ease;">
            <i class="fa-solid fa-handshake"></i>
            <span class="tabular-numbers">{{ reactions.agrees|default:0 }}</span>
        </button>
    </form>
</div>
