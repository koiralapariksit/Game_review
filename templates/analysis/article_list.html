{% extends 'base.html' %}

{% block title %}Intelligence & Analysis Archive | Culer Intel{% endblock %}

{% block content %}
<div class="container" style="padding-top: 2.5rem; padding-bottom: 4rem;">

    <div class="section-header" style="margin-bottom: 2rem;">
        <div class="section-title-wrap">
            <span class="section-label">Editorial Repository</span>
            <h1 class="section-title">Tactical & Editorial Articles</h1>
        </div>
    </div>

    <!-- HTMX Dynamic Filter Bar -->
    <div class="surface-card" style="margin-bottom: 2rem; padding: 1.25rem;">
        <form method="get" 
              action="{% url 'analysis:article_list' %}"
              hx-get="{% url 'analysis:article_list' %}" 
              hx-target="#article-grid-container" 
              hx-trigger="change, keyup delay:300ms from:#search-filter"
              style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center;">
            
            <div style="flex: 1; min-width: 220px;">
                <input type="text" id="search-filter" name="search" placeholder="Search headline or keywords..." 
                       value="{{ search_query|default:'' }}" class="search-input" style="width: 100%; display: block;">
            </div>

            <div style="min-width: 200px;">
                <select name="category" class="search-input" style="width: 100%; display: block;">
                    <option value="">All Categories</option>
                    {% for code, name in categories %}
                        <option value="{{ code }}" {% if category_filter == code %}selected{% endif %}>{{ name }}</option>
                    {% endfor %}
                </select>
            </div>
        </form>
    </div>

    <!-- Article Grid Target -->
    <div id="article-grid-container">
        {% include 'analysis/partials/article_grid.html' %}
    </div>

</div>
{% endblock %}
