{% extends 'base.html' %}

{% block title %}FC Barcelona First-Team Squad | Culer Intel{% endblock %}

{% block content %}
<div class="container" style="padding-top: 2.5rem; padding-bottom: 4rem;">

    <div class="section-header" style="margin-bottom: 2rem;">
        <div class="section-title-wrap">
            <span class="section-label">First-Team Roster</span>
            <h1 class="section-title">Squad Intelligence</h1>
        </div>
    </div>

    <!-- Position Filter Bar with HTMX -->
    <div style="display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap;">
        <a href="{% url 'players:player_list' %}" 
           hx-get="{% url 'players:player_list' %}" 
           hx-target="#player-grid-container"
           class="badge {% if not position_filter %}badge-ai{% endif %}" style="padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer;">
            All Positions
        </a>
        <a href="{% url 'players:player_list' %}?position=GK" 
           hx-get="{% url 'players:player_list' %}?position=GK" 
           hx-target="#player-grid-container"
           class="badge {% if position_filter == 'GK' %}badge-ai{% endif %}" style="padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer;">
            Goalkeepers
        </a>
        <a href="{% url 'players:player_list' %}?position=DF" 
           hx-get="{% url 'players:player_list' %}?position=DF" 
           hx-target="#player-grid-container"
           class="badge {% if position_filter == 'DF' %}badge-ai{% endif %}" style="padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer;">
            Defenders
        </a>
        <a href="{% url 'players:player_list' %}?position=MF" 
           hx-get="{% url 'players:player_list' %}?position=MF" 
           hx-target="#player-grid-container"
           class="badge {% if position_filter == 'MF' %}badge-ai{% endif %}" style="padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer;">
            Midfielders
        </a>
        <a href="{% url 'players:player_list' %}?position=FW" 
           hx-get="{% url 'players:player_list' %}?position=FW" 
           hx-target="#player-grid-container"
           class="badge {% if position_filter == 'FW' %}badge-ai{% endif %}" style="padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer;">
            Forwards
        </a>
    </div>

    <!-- Player Grid Container -->
    <div id="player-grid-container">
        {% include 'players/partials/player_grid.html' %}
    </div>

</div>
{% endblock %}
