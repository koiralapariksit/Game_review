{% extends 'base.html' %}

{% block title %}All Matches & Fixtures | Culer Intel{% endblock %}

{% block content %}
<div class="container" style="padding-top: 2.5rem; padding-bottom: 4rem;">

    <div class="section-header" style="margin-bottom: 2rem;">
        <div class="section-title-wrap">
            <span class="section-label">Schedule & Results</span>
            <h1 class="section-title">All Matches</h1>
        </div>
    </div>

    <!-- HTMX Dynamic Filter Bar -->
    <div class="surface-card" style="margin-bottom: 2rem; padding: 1.25rem;">
        <form method="get" 
              action="{% url 'matches:match_list' %}"
              hx-get="{% url 'matches:match_list' %}" 
              hx-target="#match-grid-container" 
              hx-trigger="change, keyup delay:300ms from:#search-filter"
              style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center;">
            
            <div style="flex: 1; min-width: 200px;">
                <input type="text" id="search-filter" name="search" placeholder="Search opponent or venue..." 
                       value="{{ search_query|default:'' }}" class="search-input" style="width: 100%; display: block;">
            </div>

            <div style="min-width: 160px;">
                <select name="competition" class="search-input" style="width: 100%; display: block;">
                    <option value="">All Competitions</option>
                    {% for code, name in competitions %}
                        <option value="{{ code }}" {% if current_competition == code %}selected{% endif %}>{{ name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="min-width: 140px;">
                <select name="status" class="search-input" style="width: 100%; display: block;">
                    <option value="">All Statuses</option>
                    <option value="FINISHED" {% if current_status == 'FINISHED' %}selected{% endif %}>Finished</option>
                    <option value="SCHEDULED" {% if current_status == 'SCHEDULED' %}selected{% endif %}>Scheduled</option>
                    <option value="LIVE" {% if current_status == 'LIVE' %}selected{% endif %}>Live</option>
                </select>
            </div>
        </form>
    </div>

    <!-- Match Grid Target -->
    <div id="match-grid-container">
        {% include 'matches/partials/match_grid.html' %}
    </div>

</div>
{% endblock %}
